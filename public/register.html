<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

    <section class="register">

    <article class="leftside">
    <div class="image">
        <img class="cat" src="pics/femcat.png">
    </div>

    <div class="bottom-left">
        <img class="logo" src="pics/catlogo.png">
        <h1>Your Everyday <br> <span>Store Assistant</span></h1>
    </div>
    </article>


    
    <article class="right-side">

        <form>
        <p class="intro">Create an Acount</p>
        <label for="email">E-mail: </label>
        <input type="email" id="email" name="email">

        <label for="username">Username: </label>
        <input type="text" id="username" name="username">

        <label for="password">Password: </label>
        <input type="text" id="password" name="password">

        <label for="cpassword">Confirm Password: </label>
        <input type="text" id="cpassword" name="cpassword">

        <p class="terms">
            By clicking "Create Account", you agree to SariTrack's
            <u>Terms of Service</u> and have read the
            <u>Privacy Policy</u>.
        </p>

        <button type="submit" class="create-btn">Create Account</button>

        <p class="login-text">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </form>

    </article>
    
    </section>
    
   
</body>
</html>
