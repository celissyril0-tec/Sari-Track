<header class="header">
  <div class="left-side">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">&#9776;</button>
    <img class="header-logo" src="pics/catlogo.png">
    <h2>Sari<span>Track</span></h2>
  </div>

  <div class="right-side">

    <!-- Notifications -->
    <div class="dropdown">
      <button class="header-btn" type="button">
        <img class="bell" src="icons/notifications.png" alt="Notifications">
        <span class="notif-badge" id="notifBadge" hidden>0</span>
      </button>

      <div class="dropdown-menu">
        <div class="menu-box notif-box">
          <div class="notif-head">
            <h3>Notifications</h3>
            <button type="button" class="mark-read" id="markReadBtn" onclick="markAllAsRead()">Mark all as read</button>
          </div>
          <div id="notifList"></div>
        </div>
      </div>
    </div>

    <!-- My Account -->
    <div class="dropdown">
      <div class="account-info" tabindex="0">
        <img class="account" src="icons/account.png">
        <span>My Account</span>
      </div>

      <div class="dropdown-menu">
        <div class="menu-box account-box">
          <div class="account-user">
            <strong id="accountName">Loading...</strong>
            <small id="accountStore"></small>
          </div>
          <a href="#" data-pwa-install>Install app</a>
          <a href="settings.html">Settings</a>
          <a href="#" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>

  </div>
  <link rel="icon" href="pics/catlogo.png">
</header>
