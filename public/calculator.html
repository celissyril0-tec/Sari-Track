<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calculator.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="left-side">
            <img class="header-logo" src="pics/catlogo.png">
            <h2>Sari<span>Track</span></h2>
        </div>

        <div class="right-side">
          <img class="bell" src="pics/notifications.png">

          <div class="account-info">
            <img class="account" src="pics/account.png">
            <span>My Account</span>
         </div>

        </div>
    </header>

    <nav class="side-bar">
        <ul class="menu-links">
            <li>
              <a href="dashboard.html">
                <img class="icon" src="pics/dashboard.png">
                <span>Dashboard</span>
              </a>
            </li>

            <li>
              <a href="sales.html">
                <img class="icon" src="pics/sales_icon.png">
                <span>Sales</span>
              </a>
            </li>

            <li>
              <a href="inventory.html">
                <img class="icon" src="pics/inventory-icon.png">
                <span>Inventory</span>
              </a>
            </li>

            <li>
              <a href="utang.html">
                <img class="icon" src="pics/utang.png">
                <span>Utang Ledger</span>
              </a>
            </li>

             <li>
              <a href="calculator.html" class="active">
                <img class="icon" src="pics/calculator-icon.png">
                <span>Calculator</span>
              </a>
            </li>
        </ul>

        <ul class="bottom-links">
          <li>
            <a href="settings.html">
              <img class="icon" src="pics/settings.png">
              <span>Settings</span>
            </a>
          </li>

          <li>
            <a href="login.html">
              <img class="icon" src="pics/logout.png">
              <span>Logout</span>
            </a>
          </li>
        </ul>
    </nav>

    <main>

    <div class="upper-section">
      <img class="logo" src="pics/cat.png">

    <div class="calcu-intro">
      <h2>CALCULATOR</h2>
      <p>Tap, calculate, and know your earnings!</p>
    </div>

    </div>

    <hr>

    <section class="container">

      <div class="calculator">

         <div class="display" id="display">0</div>

         <div class="buttons">

           <button class="clear" onclick="clearAll()">C</button>
           <button class="clear" onclick="toggleSign()">+/-</button>
           <button class="clear" onclick="percent()">%</button>
           <button class="operator" onclick="pressOperator('÷')">÷</button>

           <button class="number" onclick="pressNumber('7')">7</button>
           <button class="number" onclick="pressNumber('8')">8</button>
           <button class="number" onclick="pressNumber('9')">9</button>
           <button class="operator" onclick="pressOperator('×')">×</button>
 
           <button class="number" onclick="pressNumber('4')">4</button>
           <button class="number" onclick="pressNumber('5')">5</button>
           <button class="number" onclick="pressNumber('6')">6</button>
           <button class="operator" onclick="pressOperator('−')">−</button>
 
          <button class="number" onclick="pressNumber('1')">1</button>
          <button class="number" onclick="pressNumber('2')">2</button>
          <button class="number" onclick="pressNumber('3')">3</button>
          <button class="operator" onclick="pressOperator('+')">+</button>
 
          <button class="number zero" onclick="pressNumber('0')">0</button>
          <button class="number" onclick="pressNumber('.')">.</button>
          <button class="operator" onclick="calculate()">=</button>

       </div>

      </div>

    </section>
       
    </main>

    <script src="js/calculator.js"></script>  
</body>
</html>
