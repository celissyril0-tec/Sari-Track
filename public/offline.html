<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | SariTrack</title>
  <meta name="theme-color" content="#0151ce">
  <link rel="icon" href="/pics/catlogo.png">
  <style>
    html, body { margin: 0; height: 100%; background: #F1EBDD; color: #1b2a4a; font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 20px; margin-inline: auto; }
    h1 { margin: 0; font-size: 1.5rem; }
    p { margin: 0; max-width: 32ch; line-height: 1.5; }
    button { justify-self: center; padding: 10px 20px; border: 0; border-radius: 8px; background: #0151ce; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/pwa/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>SariTrack needs an internet connection to load your store data. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
