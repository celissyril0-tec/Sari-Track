<!DOCTYPE html>
<html>
<head>
  <title>SariTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  
</head>
<body>

  <header class="header">
        <div class="left-side">
            <img class="header-logo" src="pics/catlogo.png">
            <h2>Sari<span>Track</span></h2>
        </div>

        <div class="right-side">
          <img class="bell" src="pics/notifications.png">

          <div class="account-info">
            <img class="account" src="pics/account.png">
            <span>My Account</span>
         </div>

        </div>
    </header>

    <nav class="side-bar">
        <ul class="menu-links">
            <li>
              <a href="index.html">
                <img class="icon" src="pics/dashboard.png">
                <span>Dashboard</span>
              </a>
            </li>

            <li>
              <a href="sales.html">
                <img class="icon" src="pics/sales_icon.png">
                <span>Sales</span>
              </a>
            </li>

            <li>
              <a href="inventory.html">
                <img class="icon" src="pics/inventory-icon.png">
                <span>Inventory</span>
              </a>
            </li>

            <li>
              <a href="utang.html">
                <img class="icon" src="pics/utang.png">
                <span>Utang Ledger</span>
              </a>
            </li>

            <li>
              <a href="utang.html">
                <img class="icon" src="pics/calculator-icon.png">
                <span>Calculator</span>
              </a>
            </li>
        </ul>

        <ul class="bottom-links">
          <li>
            <a href="settings.html">
              <img class="icon" src="pics/settings.png">
              <span>Settings</span>
            </a>
          </li>

          <li>
            <a href="log-out.html">
              <img class="icon" src="pics/logout.png">
              <span>Logout</span>
            </a>
          </li>
        </ul>
    </nav>



  <main>
    <p class="welcome">Welcome New User</p>

    <section class="new-user">
      
      <article class="add-store">

        <div class="add-store-info">
          <h3>You don't have a store yet.</h3>
          <p>
            Add your store to start tracking daily sales, 
            credit records, and fast moving inventory effortlessly.
          </p>

          <button class="add-btn">
            <img class="icon" src="pics/Vector.png">
            <span>+</span>
            Add store
          </button>

        </div>

        <div class="cat-logo">
          <img class="logo" src="pics/cat.png">
        </div>

      </article>
    </section>

  </main>






  <script src="js/script.js"></script>
</body>
</html>
